<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>türkHUB</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <!-- FontAwesome İkonları -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts: Montserrat & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
      color: #fff;
    }
    .logo-font {
      font-family: 'Outfit', 'Montserrat', sans-serif;
    }
    .swiper {
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    .swiper-slide {
      position: relative;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-overlay-bottom {
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
      padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
    }
    .video-overlay-top {
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
      padding-top: max(1.25rem, env(safe-area-inset-top));
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
      transition: height 0.15s ease;
    }
    input[type=range]:hover {
      height: 8px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #dc2626;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.9);
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }
    input[type=range]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: #dc2626;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.9);
    }

    .spin-once {
      animation: spin 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden select-none bg-black">

  <!-- Top Header Bar with Logo, Categories, Ghost Page Info, Shuffle & Sound Toggle -->
  <div class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 sm:px-6 py-4 video-overlay-top pointer-events-none">
    <!-- Logo -->
    <div class="logo-font flex items-center tracking-tighter text-2xl sm:text-3xl font-black drop-shadow-lg pointer-events-auto cursor-pointer" id="logo-btn" title="Ana Sayfa (Tümü)">
      <span class="text-white tracking-normal">türk</span>
      <span class="bg-red-600 text-black px-2 py-0.5 rounded-md ml-1 text-xl sm:text-2xl font-black uppercase shadow-lg shadow-red-900/50">HUB</span>
    </div>

    <!-- Kategori Butonları & Kontroller -->
    <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto">
      <!-- Kategoriler -->
      <div class="flex items-center gap-1 bg-black/60 border border-white/20 p-1 rounded-full backdrop-blur-md">
        <button id="cat-all-btn" class="cat-btn px-3 py-1 text-xs font-bold rounded-full bg-red-600 text-white transition">
          Tümü
        </button>
        <button id="cat-turkp-btn" class="cat-btn px-3 py-1 text-xs font-bold rounded-full text-zinc-300 hover:text-white transition">
          türkp
        </button>
      </div>

      <!-- Sayfa Rozeti -->
      <div id="page-badge" class="hidden sm:block text-xs font-mono bg-black/60 border border-white/20 px-3 py-1.5 rounded-full text-zinc-300 backdrop-blur-md">
        Sayfa 1
      </div>

      <!-- Karıştır (Shuffle) Butonu -->
      <button id="shuffle-btn" title="Videoları Karıştır" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-black/50 border border-white/20 backdrop-blur-md flex items-center justify-center text-white active:scale-90 transition hover:bg-black/80 hover:border-red-500">
        <i class="fa-solid fa-shuffle text-sm sm:text-base" id="shuffle-icon"></i>
      </button>

      <!-- Ses Aç / Kapat Butonu -->
      <button id="sound-toggle-btn" title="Ses Aç / Kapat" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-black/50 border border-white/20 backdrop-blur-md flex items-center justify-center text-white active:scale-90 transition hover:bg-black/80">
        <i class="fa-solid fa-volume-xmark text-base sm:text-lg" id="sound-icon"></i>
      </button>
    </div>
  </div>

  <!-- Swiper Container -->
  <div class="swiper mainSwiper">
    <div class="swiper-wrapper" id="video-wrapper">
      <!-- Dynamic Slides -->
    </div>
  </div>

  <!-- JS Veri Dosyaları -->
  <script src="veriler.js"></script>
  <script src="tpcat.js"></script>

  <!-- Swiper.js Script -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    const PAGE_SIZE = 10;
    let currentGhostPage = 0;
    let fullVideoList = [];
    let activeCategory = 'all'; // 'all' (veriler.js) veya 'turkp' (tpcat.js)
    let swiper = null;
    let isGlobalMuted = true;
    let isTransitioning = false;

    const getVideoUrl = (postId) => `https://erk1.moegames.club/ltdfree/erk-${postId}.mp4?auth=12345`;

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function destroyExistingVideos() {
      const oldVideos = document.querySelectorAll('video');
      oldVideos.forEach(video => {
        try {
          video.pause();
          video.removeAttribute('src');
          video.load();
        } catch (e) {}
      });
    }

    // Doğrudan veriler.js (window.videoData) ve tpcat.js (window.tpcatData) dosyalarından çekme
    function loadVideosFromCategory(categoryName) {
      activeCategory = categoryName;

      const catAllBtn = document.getElementById('cat-all-btn');
      const catTurkpBtn = document.getElementById('cat-turkp-btn');

      if (categoryName === 'all') {
        catAllBtn.className = 'cat-btn px-3 py-1 text-xs font-bold rounded-full bg-red-600 text-white transition';
        catTurkpBtn.className = 'cat-btn px-3 py-1 text-xs font-bold rounded-full text-zinc-300 hover:text-white transition';
        
        // Tümü -> veriler.js (window.videoData)
        if (window.videoData && Array.isArray(window.videoData)) {
          fullVideoList = window.videoData;
        } else {
          fullVideoList = [];
        }
      } else if (categoryName === 'turkp') {
        catTurkpBtn.className = 'cat-btn px-3 py-1 text-xs font-bold rounded-full bg-red-600 text-white transition';
        catAllBtn.className = 'cat-btn px-3 py-1 text-xs font-bold rounded-full text-zinc-300 hover:text-white transition';

        // türkp -> tpcat.js (window.tpcatData)
        if (window.tpcatData && Array.isArray(window.tpcatData)) {
          fullVideoList = window.tpcatData;
        } else {
          fullVideoList = [];
        }
      }

      if (!fullVideoList || fullVideoList.length === 0) {
        document.getElementById('video-wrapper').innerHTML = `
          <div class="swiper-slide flex flex-col items-center justify-center text-center p-6">
            <p class="text-xl text-red-500 font-bold mb-2">Veri Bulunamadı</p>
            <p class="text-sm text-zinc-400 max-w-md">Seçilen dosyada (veriler.js / tpcat.js) henüz gösterilecek video bulunamadı.</p>
          </div>`;
        return;
      }

      currentGhostPage = 0;
      renderGhostPage(0, 0);
    }

    function renderGhostPage(pageIndex, initialSlideOffset = 0) {
      destroyExistingVideos();

      const wrapper = document.getElementById('video-wrapper');
      const start = pageIndex * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, fullVideoList.length);
      const pageData = fullVideoList.slice(start, end);

      const totalPages = Math.ceil(fullVideoList.length / PAGE_SIZE) || 1;
      document.getElementById('page-badge').textContent = `Sayfa ${pageIndex + 1} / ${totalPages}`;

      if (swiper) {
        swiper.destroy(true, true);
        swiper = null;
      }

      const hasNextPage = end < fullVideoList.length;
      const hasPrevPage = pageIndex > 0;

      let slidesHTML = '';

      if (hasPrevPage) {
        slidesHTML += `
          <div class="swiper-slide prev-page-trigger flex flex-col items-center justify-center bg-black text-white">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-red-600 mb-3"></i>
            <p class="text-sm font-semibold text-zinc-400">Önceki Videolar Yükleniyor...</p>
          </div>
        `;
      }

      slidesHTML += pageData.map((item, index) => {
        const postId = item.post_id || item['post-id'];
        const videoSrc = getVideoUrl(postId);
        const title = item.title || 'Başlıksız Video';
        const preloadType = index === 0 ? 'auto' : 'metadata';

        return `
          <div class="swiper-slide video-slide cursor-pointer">
            <video src="${videoSrc}" loop muted playsinline preload="${preloadType}"></video>
            
            <div class="action-icon-overlay absolute inset-0 m-auto w-20 h-20 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center opacity-0 scale-75 transition-all duration-300 pointer-events-none z-20">
              <i class="action-icon fa-solid fa-play text-3xl text-white"></i>
            </div>

            <div class="absolute inset-0 z-10 flex flex-col justify-end px-6 pb-12 md:pb-8 video-overlay-bottom">
              <h2 class="text-lg md:text-xl font-semibold text-white/95 drop-shadow line-clamp-2 mb-3 pointer-events-none">
                ${title}
              </h2>

              <div class="timeline-container w-full flex flex-col gap-1.5 pointer-events-auto">
                <input type="range" class="timeline-slider" min="0" max="100" value="0" step="0.1" />
                <div class="flex items-center justify-between text-xs text-zinc-300 font-mono">
                  <span class="current-time">00:00</span>
                  <span class="total-duration">00:00</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (hasNextPage) {
        slidesHTML += `
          <div class="swiper-slide next-page-trigger flex flex-col items-center justify-center bg-black text-white">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-red-600 mb-3"></i>
            <p class="text-sm font-semibold text-zinc-400">Sonraki Videolar Yükleniyor...</p>
          </div>
        `;
      }

      wrapper.innerHTML = slidesHTML;

      let targetIndex = initialSlideOffset;
      if (hasPrevPage && initialSlideOffset >= 0) {
        targetIndex = initialSlideOffset + 1;
      }

      initSwiper(targetIndex, hasPrevPage, hasNextPage);
    }

    function initSwiper(startIndex, hasPrevPage, hasNextPage) {
      swiper = new Swiper('.mainSwiper', {
        direction: 'vertical',
        slidesPerView: 1,
        spaceBetween: 0,
        initialSlide: startIndex,
        mousewheel: true,
        keyboard: {
          enabled: true,
        },
        speed: 300,
        on: {
          init: function () {
            handleVideoPlayback(this);
          },
          slideChange: function () {
            if (isTransitioning) return;
            const currentSlide = this.slides[this.activeIndex];

            if (currentSlide && currentSlide.classList.contains('next-page-trigger')) {
              isTransitioning = true;
              currentGhostPage++;
              renderGhostPage(currentGhostPage, 0);
              setTimeout(() => { isTransitioning = false; }, 400);
              return;
            }

            if (currentSlide && currentSlide.classList.contains('prev-page-trigger')) {
              isTransitioning = true;
              currentGhostPage--;
              renderGhostPage(currentGhostPage, PAGE_SIZE - 1);
              setTimeout(() => { isTransitioning = false; }, 400);
              return;
            }

            handleVideoPlayback(this);
          }
        }
      });

      document.querySelectorAll('.video-slide').forEach(slide => {
        const video = slide.querySelector('video');
        const overlay = slide.querySelector('.action-icon-overlay');
        const icon = slide.querySelector('.action-icon');
        const slider = slide.querySelector('.timeline-slider');
        const currentTimeEl = slide.querySelector('.current-time');
        const durationEl = slide.querySelector('.total-duration');
        const timelineContainer = slide.querySelector('.timeline-container');

        if (video) {
          slide.addEventListener('click', (e) => {
            if (e.target.closest('#sound-toggle-btn') || e.target.closest('#shuffle-btn') || e.target.closest('.timeline-container') || e.target.closest('.cat-btn')) return;

            if (video.paused) {
              video.play();
              triggerIconAnimation(overlay, icon, 'fa-play');
            } else {
              video.pause();
              triggerIconAnimation(overlay, icon, 'fa-pause');
            }
          });

          video.addEventListener('timeupdate', () => {
            if (video.duration && !slider.isDragging) {
              const progress = (video.currentTime / video.duration) * 100;
              slider.value = progress;
              currentTimeEl.textContent = formatTime(video.currentTime);
              durationEl.textContent = formatTime(video.duration);
            }
          });

          video.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(video.duration);
          });

          if (slider) {
            slider.addEventListener('mousedown', () => { slider.isDragging = true; });
            slider.addEventListener('touchstart', () => { slider.isDragging = true; });

            slider.addEventListener('input', (e) => {
              e.stopPropagation();
              if (video.duration) {
                const targetTime = (slider.value / 100) * video.duration;
                video.currentTime = targetTime;
                currentTimeEl.textContent = formatTime(targetTime);
              }
            });

            slider.addEventListener('mouseup', () => { slider.isDragging = false; });
            slider.addEventListener('touchend', () => { slider.isDragging = false; });
            
            timelineContainer.addEventListener('touchstart', (e) => e.stopPropagation());
            timelineContainer.addEventListener('touchmove', (e) => e.stopPropagation());
          }
        }
      });
    }

    function triggerIconAnimation(overlay, icon, iconClass) {
      if (!overlay || !icon) return;
      
      icon.className = `action-icon fa-solid ${iconClass} text-3xl text-white ${iconClass === 'fa-play' ? 'ml-1' : ''}`;
      overlay.classList.remove('opacity-0', 'scale-75');
      overlay.classList.add('opacity-100', 'scale-100');

      setTimeout(() => {
        overlay.classList.remove('opacity-100', 'scale-100');
        overlay.classList.add('opacity-0', 'scale-75');
      }, 400);
    }

    function handleVideoPlayback(swiperInstance) {
      if (!swiperInstance || !swiperInstance.slides) return;
      
      const currentIndex = swiperInstance.activeIndex;
      const slides = swiperInstance.slides;

      slides.forEach((slide, index) => {
        const video = slide.querySelector('video');
        if (!video) return;

        if (index === currentIndex) {
          video.muted = isGlobalMuted;
          video.currentTime = 0;
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {});
          }
        } else {
          video.pause();
        }
      });
    }

    // Kategori Tıklama Etkileşimleri
    document.getElementById('cat-all-btn').addEventListener('click', () => loadVideosFromCategory('all'));
    document.getElementById('cat-turkp-btn').addEventListener('click', () => loadVideosFromCategory('turkp'));
    document.getElementById('logo-btn').addEventListener('click', () => loadVideosFromCategory('all'));

    // Karıştır (Shuffle)
    const shuffleBtn = document.getElementById('shuffle-btn');
    const shuffleIcon = document.getElementById('shuffle-icon');

    shuffleBtn.addEventListener('click', () => {
      if (fullVideoList.length === 0) return;

      shuffleIcon.classList.add('spin-once');
      setTimeout(() => shuffleIcon.classList.remove('spin-once'), 500);

      destroyExistingVideos();
      fullVideoList = shuffleArray(fullVideoList);
      currentGhostPage = 0;
      renderGhostPage(0, 0);
    });

    // Ses Aç / Kapat
    const soundBtn = document.getElementById('sound-toggle-btn');
    const soundIcon = document.getElementById('sound-icon');

    soundBtn.addEventListener('click', () => {
      isGlobalMuted = !isGlobalMuted;
      
      document.querySelectorAll('video').forEach(vid => {
        vid.muted = isGlobalMuted;
      });

      if (isGlobalMuted) {
        soundIcon.className = 'fa-solid fa-volume-xmark text-base sm:text-lg';
      } else {
        soundIcon.className = 'fa-solid fa-volume-high text-base sm:text-lg text-red-500';
      }
    });

    // Sayfa Yüklendiğinde Başlat
    document.addEventListener('DOMContentLoaded', () => loadVideosFromCategory('all'));
  </script>
</body>
</html>
